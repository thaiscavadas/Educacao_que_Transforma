<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --ink:#111827;
    --muted:#7b8698;
    --line:#eef1f6;
    --field:#f4f6fa;
    --indigo:#6366f1;
    --violet:#a855f7;
    --blue:#3b82f6;
    --amber:#f59e0b;
    --green:#10b981;
    --pink:#ec4899;
    --r:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--bg);
    font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    font-weight:600;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:
      calc(env(safe-area-inset-top) + 16px)
      calc(env(safe-area-inset-right) + 14px)
      calc(env(safe-area-inset-bottom) + 28px)
      calc(env(safe-area-inset-left) + 14px);
    touch-action:manipulation;
  }
  .app{width:100%; max-width:400px;}

  /* ---------- topo ---------- */
  .greet{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:2px 6px 14px;
  }
  .greet h1{font-size:21px; font-weight:800; margin:0; letter-spacing:-.02em;}
  .greet .date{
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    background:#fff;
    border-radius:999px;
    padding:7px 12px;
    box-shadow:0 1px 2px rgba(16,24,40,.05);
    white-space:nowrap;
  }

  /* ---------- destaque ---------- */
  .hero{
    background:linear-gradient(135deg,var(--indigo) 0%, var(--violet) 100%);
    border-radius:26px;
    padding:22px 22px 20px;
    color:#fff;
    box-shadow:0 14px 30px -10px rgba(99,102,241,.55);
    margin-bottom:14px;
  }
  .hero-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .hero-label{
    font-size:11px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    opacity:.85;
  }
  .hero-chip{
    font-size:11px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    background:rgba(255,255,255,.22);
    border-radius:999px;
    padding:5px 10px;
    white-space:nowrap;
  }
  .hero-time{
    font-size:60px;
    font-weight:800;
    line-height:1.05;
    letter-spacing:-.035em;
    font-variant-numeric:tabular-nums;
    margin:6px 0 2px;
    transition:opacity .2s ease;
  }
  .hero-sub{font-size:15px; font-weight:600; opacity:.92; min-height:21px;}
  .bar{
    height:7px;
    border-radius:999px;
    background:rgba(255,255,255,.25);
    overflow:hidden;
    margin-top:16px;
  }
  .bar span{
    display:block;
    height:100%;
    width:0%;
    border-radius:999px;
    background:#fff;
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  .bar-legend{
    display:flex;
    justify-content:space-between;
    font-size:11.5px;
    font-weight:700;
    opacity:.8;
    margin-top:7px;
    letter-spacing:.02em;
  }
  .hero.is-done{background:linear-gradient(135deg,#10b981 0%, #22c55e 100%); box-shadow:0 14px 30px -10px rgba(16,185,129,.55);}

  /* ---------- cartões ---------- */
  .card{
    background:var(--card);
    border-radius:var(--r);
    box-shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 20px -14px rgba(16,24,40,.25);
    padding:6px 16px;
    margin-bottom:12px;
  }
  .line{
    display:flex;
    align-items:center;
    gap:11px;
    padding:13px 0;
  }
  .line + .line{border-top:1px solid var(--line);}

  .ico{
    flex:0 0 auto;
    width:36px; height:36px;
    border-radius:12px;
    display:grid;
    place-items:center;
  }
  .ico svg{width:18px; height:18px; stroke-width:2.2;}
  .ico.blue{background:#e8f0ff; color:var(--blue);}
  .ico.amber{background:#fef4e2; color:var(--amber);}
  .ico.green{background:#e3f8ef; color:var(--green);}
  .ico.pink{background:#fdeaf4; color:var(--pink);}

  .txt{flex:1 1 auto; min-width:0;}
  .txt b{display:block; font-size:16px; font-weight:700; letter-spacing:-.01em;}
  .txt small{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    margin-top:1px;
  }
  .txt small.ok{color:var(--green);}

  .ctrl{display:flex; align-items:center; gap:7px; flex:0 0 auto;}

  input[type="time"], input[type="text"]{
    font-family:inherit;
    font-size:19px;
    font-weight:800;
    letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    background:var(--field);
    border:2px solid transparent;
    border-radius:12px;
    padding:8px 6px;
    width:86px;
    min-height:42px;
    text-align:center;
    -webkit-appearance:none;
    appearance:none;
  }
  input[type="text"]{width:78px;}
  input[type="time"]::-webkit-date-and-time-value{text-align:center;}
  input::-webkit-calendar-picker-indicator{opacity:0; width:0; margin:0;}
  input:focus{outline:none; border-color:var(--indigo); background:#fff;}
  input.is-preview{color:#9aa4b5;}

  .now{
    font-family:inherit;
    font-size:11.5px;
    font-weight:800;
    letter-spacing:.02em;
    color:var(--indigo);
    background:#eef0ff;
    border:none;
    border-radius:999px;
    padding:9px 11px;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .now:active{transform:scale(.9); background:#e0e3ff;}

  .step{
    font-family:inherit;
    font-size:19px;
    font-weight:700;
    line-height:1;
    width:36px; height:36px;
    border:none;
    border-radius:12px;
    background:var(--field);
    color:var(--ink);
    cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .step:active{transform:scale(.88); background:#e9edf5;}

  .tag{
    font-size:10px;
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
    border-radius:999px;
    padding:4px 8px;
    background:var(--field);
    color:var(--muted);
    white-space:nowrap;
  }
  .tag.is-marked{background:#e3f8ef; color:#0a9268;}

  .alert{
    font-size:13.5px;
    font-weight:600;
    color:#e02d3c;
    background:#fdecee;
    border-radius:14px;
    padding:11px 14px;
    margin-bottom:12px;
    display:none;
  }
  .alert.show{display:block;}

  .reset{
    display:block;
    width:100%;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    color:var(--muted);
    background:none;
    border:none;
    padding:8px;
    cursor:pointer;
  }
  .reset:active{color:var(--ink);}

  @media (prefers-reduced-motion: reduce){
    .bar span{transition:none;}
    .now:active,.step:active{transform:none;}
  }
  @media (max-width:360px){
    .hero-time{font-size:52px;}
    input[type="time"]{width:80px;}
    .card{padding:4px 13px;}
  }
</style>
</head>
<body>

<div class="app">

  <header class="greet">
    <h1 id="saudacao">Olá</h1>
    <span class="date" id="hoje"></span>
  </header>

  <section class="hero" id="hero">
    <div class="hero-top">
      <span class="hero-label">Saída</span>
      <span class="hero-chip" id="chip">previsão</span>
    </div>
    <div class="hero-time" id="horaSaida">--:--</div>
    <div class="hero-sub" id="sub">Marque a sua entrada</div>
    <div class="bar"><span id="barra"></span></div>
    <div class="bar-legend">
      <span id="feito">0% da jornada</span>
      <span id="jornadaLegenda">8h17</span>
    </div>
  </section>

  <div class="alert" id="alerta"></div>

  <section class="card">
    <div class="line">
      <span class="ico blue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/>
        </svg>
      </span>
      <span class="txt">
        <b>Entrada</b>
        <small id="subEntrada">hora que você chegou</small>
      </span>
      <span class="ctrl">
        <button class="now" type="button" data-fill="entrada">agora</button>
        <input type="time" id="entrada" aria-label="Hora de entrada">
      </span>
    </div>
  </section>

  <section class="card">
    <div class="line">
      <span class="ico amber">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 3v7a3 3 0 0 0 6 0V3"/><path d="M7 10v11"/><path d="M17 3c-1.5 2-2 3.5-2 6s.7 3 2 3 2-.5 2-3 -.5-4-2-6z"/><path d="M17 12v9"/>
        </svg>
      </span>
      <span class="txt">
        <b>Saiu pro almoço</b>
        <small id="subSaida">previsto 12:30</small>
      </span>
      <span class="ctrl">
        <span class="tag" id="tagSaida">previsto</span>
        <button class="now" type="button" data-fill="saidaAlmoco">agora</button>
        <input type="time" id="saidaAlmoco" value="12:30" class="is-preview" aria-label="Saída para o almoço">
      </span>
    </div>
    <div class="line">
      <span class="ico green">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>
        </svg>
      </span>
      <span class="txt">
        <b>Voltou</b>
        <small id="subVolta">previsto 13:00</small>
      </span>
      <span class="ctrl">
        <span class="tag" id="tagVolta">previsto</span>
        <button class="now" type="button" data-fill="voltaAlmoco">agora</button>
        <input type="time" id="voltaAlmoco" value="13:00" class="is-preview" aria-label="Volta do almoço">
      </span>
    </div>
  </section>

  <section class="card">
    <div class="line">
      <span class="ico pink">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17V7"/><path d="M21 17V7"/><path d="M7 12h10"/><path d="M7 8v8"/><path d="M17 8v8"/>
        </svg>
      </span>
      <span class="txt">
        <b>Jornada</b>
        <small id="subJornada">horas do dia</small>
      </span>
      <span class="ctrl">
        <button class="step" type="button" id="menos" aria-label="Diminuir 15 minutos">−</button>
        <input type="text" id="jornada" value="08:17" inputmode="numeric" aria-label="Jornada em horas e minutos">
        <button class="step" type="button" id="mais" aria-label="Aumentar 15 minutos">+</button>
      </span>
    </div>
  </section>

  <button class="reset" type="button" id="limpar">Limpar o dia</button>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const NOME = "Thais";                 // troque aqui se quiser outro nome
  const PADRAO_SAIDA = '12:30', PADRAO_VOLTA = '13:00';
  const ALMOCO_PADRAO = 30;             // minutos de almoço na previsão

  const jornadaEl = $('jornada'), entradaEl = $('entrada');
  const saidaAlmocoEl = $('saidaAlmoco'), voltaAlmocoEl = $('voltaAlmoco');
  const tagSaida = $('tagSaida'), tagVolta = $('tagVolta');
  const subSaida = $('subSaida'), subVolta = $('subVolta'), subJornada = $('subJornada');
  const horaSaida = $('horaSaida'), hero = $('hero'), chip = $('chip'), sub = $('sub');
  const barra = $('barra'), feito = $('feito'), jornadaLegenda = $('jornadaLegenda');
  const alerta = $('alerta');

  let marcouSaida = false, marcouVolta = false;

  const hojeISO = new Date().toISOString().slice(0,10);
  const h = new Date().getHours();
  $('saudacao').textContent = (h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite') + ', ' + NOME;
  $('hoje').textContent = new Date()
    .toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'short'})
    .replace(/\./g,'');

  /* ---------- memória do dia ---------- */
  function salvar(){
    try{
      localStorage.setItem('ponto', JSON.stringify({
        dia:hojeISO, jornada:jornadaEl.value, entrada:entradaEl.value,
        saidaAlmoco:saidaAlmocoEl.value, voltaAlmoco:voltaAlmocoEl.value,
        marcouSaida, marcouVolta
      }));
    }catch(e){}
  }
  function restaurar(){
    let d;
    try{ d = JSON.parse(localStorage.getItem('ponto') || 'null'); }catch(e){}
    if(!d) return;
    if(d.jornada) jornadaEl.value = d.jornada;   // a jornada vale sempre
    if(d.dia !== hojeISO) return;                // o resto, só se ainda for hoje
    if(d.entrada) entradaEl.value = d.entrada;
    if(d.saidaAlmoco) saidaAlmocoEl.value = d.saidaAlmoco;
    if(d.voltaAlmoco) voltaAlmocoEl.value = d.voltaAlmoco;
    marcouSaida = !!d.marcouSaida;
    marcouVolta = !!d.marcouVolta;
  }

  /* ---------- horas ---------- */
  function paraMin(txt){
    if(!txt) return null;
    const m = String(txt).trim().match(/^(\d{1,2})\s*[:hH.,]?\s*(\d{2})$/);
    if(!m) return null;
    const min = +m[2];
    return min > 59 ? null : (+m[1])*60 + min;
  }
  function paraTexto(min){
    min = ((min % 1440) + 1440) % 1440;
    return String(Math.floor(min/60)).padStart(2,'0') + ':' + String(min%60).padStart(2,'0');
  }
  function duracao(min){
    const hh = Math.floor(min/60), mm = min%60;
    if(hh && mm) return hh + 'h' + String(mm).padStart(2,'0');
    if(hh) return hh + 'h';
    return mm + ' min';
  }
  function agoraTexto(){
    const d = new Date();
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  function aviso(txt){
    alerta.textContent = txt || '';
    alerta.classList.toggle('show', !!txt);
  }

  /* ---------- cálculo ---------- */
  function calcular(){
    const jornada = paraMin(jornadaEl.value);
    const entrada = paraMin(entradaEl.value);
    const saidaA = paraMin(saidaAlmocoEl.value) ?? paraMin(PADRAO_SAIDA);

    // enquanto você não marcar a volta, ela acompanha a saída + 30 min
    if(!marcouVolta){
      const previsto = paraTexto(saidaA + ALMOCO_PADRAO);
      if(voltaAlmocoEl.value !== previsto) voltaAlmocoEl.value = previsto;
    }
    const voltaA = paraMin(voltaAlmocoEl.value) ?? paraMin(PADRAO_VOLTA);

    tagSaida.textContent = marcouSaida ? 'marcado' : 'previsto';
    tagVolta.textContent = marcouVolta ? 'marcado' : 'previsto';
    tagSaida.classList.toggle('is-marked', marcouSaida);
    tagVolta.classList.toggle('is-marked', marcouVolta);
    subSaida.textContent = marcouSaida ? 'marcado por você' : 'previsto ' + saidaAlmocoEl.value;
    subVolta.textContent = marcouVolta ? 'marcado por você' : 'previsto ' + voltaAlmocoEl.value;
    subSaida.classList.toggle('ok', marcouSaida);
    subVolta.classList.toggle('ok', marcouVolta);
    saidaAlmocoEl.classList.toggle('is-preview', !marcouSaida);
    voltaAlmocoEl.classList.toggle('is-preview', !marcouVolta);

    if(jornada === null){
      horaSaida.textContent = '--:--';
      sub.textContent = 'Jornada inválida';
      aviso('Escreva a jornada assim: 08:17.');
      return;
    }
    jornadaLegenda.textContent = duracao(jornada);

    let intervalo = voltaA - saidaA, msg = '';
    if(intervalo < 0){ intervalo = 0; msg = 'A volta do almoço está antes da saída.'; }
    subJornada.textContent = 'almoço de ' + duracao(intervalo);

    if(entrada === null){
      horaSaida.textContent = '--:--';
      chip.textContent = 'previsão';
      sub.textContent = 'Marque a sua entrada';
      barra.style.width = '0%';
      feito.textContent = '0% da jornada';
      hero.classList.remove('is-done');
      aviso(msg);
      return;
    }
    if(!msg && saidaA < entrada) msg = 'O almoço está marcado antes da entrada.';
    aviso(msg);

    const saida = entrada + jornada + intervalo;
    horaSaida.textContent = paraTexto(saida);
    chip.textContent = (marcouSaida && marcouVolta) ? 'confirmado' : 'previsão';

    // quanto já foi trabalhado
    const agora = new Date();
    const min = agora.getHours()*60 + agora.getMinutes();
    const almocoJaTirado = Math.max(0, Math.min(min, voltaA) - saidaA);
    const trabalhado = Math.max(0, Math.min(min - entrada - Math.min(almocoJaTirado, intervalo), jornada));
    const pct = Math.round((trabalhado / jornada) * 100);
    barra.style.width = Math.max(0, Math.min(100, pct)) + '%';
    feito.textContent = pct + '% da jornada';

    const falta = saida - min;
    if(falta > 0 && falta < 960){
      sub.textContent = 'faltam ' + duracao(falta);
      hero.classList.remove('is-done');
    } else if(falta <= 0 && falta > -960){
      sub.textContent = falta === 0 ? 'pode sair agora' : 'já deu · ' + duracao(-falta) + ' a mais';
      hero.classList.add('is-done');
    } else {
      sub.textContent = 'entrada às ' + paraTexto(entrada);
      hero.classList.remove('is-done');
    }
  }

  function atualizar(){ calcular(); salvar(); }

  /* ---------- interações ---------- */
  jornadaEl.addEventListener('blur', () => {
    const v = paraMin(jornadaEl.value);
    if(v !== null) jornadaEl.value = paraTexto(v);
    atualizar();
  });
  function ajusta(delta){
    const v = paraMin(jornadaEl.value);
    if(v === null) return;
    jornadaEl.value = paraTexto(Math.max(0, Math.min(1439, v + delta)));
    atualizar();
  }
  $('mais').addEventListener('click', () => ajusta(15));
  $('menos').addEventListener('click', () => ajusta(-15));

  document.querySelectorAll('.now').forEach(b => {
    b.addEventListener('click', () => {
      const alvo = $(b.dataset.fill);
      alvo.value = agoraTexto();
      if(alvo === saidaAlmocoEl) marcouSaida = true;
      if(alvo === voltaAlmocoEl) marcouVolta = true;
      atualizar();
    });
  });

  saidaAlmocoEl.addEventListener('input', () => { marcouSaida = true; atualizar(); });
  voltaAlmocoEl.addEventListener('input', () => { marcouVolta = true; atualizar(); });
  [jornadaEl, entradaEl].forEach(el => el.addEventListener('input', atualizar));

  $('limpar').addEventListener('click', () => {
    marcouSaida = marcouVolta = false;
    entradaEl.value = '';
    saidaAlmocoEl.value = PADRAO_SAIDA;
    voltaAlmocoEl.value = PADRAO_VOLTA;
    atualizar();
  });

  document.addEventListener('visibilitychange', () => { if(!document.hidden) calcular(); });

  restaurar();
  calcular();
  setInterval(calcular, 30000);
})();
</script>
</body>
</html>
